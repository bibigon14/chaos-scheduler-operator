name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m
  
  test:
    name: envtest + go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install setup-envtest (release-0.22 branch, kubebuilder pin is broken)
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.22
      - name: Prepare envtest assets
        run: |
          # Find the newest envtest bundle whose minor matches k8s.io/api in go.mod.
          MINOR=$(grep 'k8s.io/api ' go.mod | awk '{print $2}' | sed 's/^v//' | cut -d. -f1-2)
          # setup-envtest list prints available bundles; pick the latest patch for our minor.
          VERSION=$(setup-envtest list --output json | \
            jq -r --arg minor "$MINOR" '.[] | select(.version | startswith($minor)) | .version' | \
            sort -V | tail -n1)
          if [ -z "$VERSION" ]; then
            echo "No envtest bundle available for k8s $MINOR" >&2
            exit 1
          fi
            echo "Using envtest K8s version $VERSION"
          setup-envtest use "$VERSION" --bin-dir "$GITHUB_WORKSPACE/bin"
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use "$VERSION" --bin-dir "$GITHUB_WORKSPACE/bin" -p path)" >> $GITHUB_ENV
      - name: Run tests
        run: go test ./... -race -coverprofile=cover.out -covermode=atomic
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  build:
    name: multi-arch build + push to GHCR
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chaos-scheduler-operator
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max