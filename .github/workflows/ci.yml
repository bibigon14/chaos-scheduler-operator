name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m
  
  test:
    name: envtest + go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install setup-envtest (release-0.22 branch, kubebuilder pin is broken)
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.22
      - name: Prepare envtest assets
        run: |
          # k8s.io/api in go.mod tracks Kubernetes minor: v0.34.x <=> k8s 1.34.x.
          # setup-envtest accepts wildcards; `1.34.x!` fetches the latest patch
          # available in the upstream index.
          K8S_MINOR=1.$(grep 'k8s.io/api ' go.mod | awk '{print $2}' | sed 's/^v0\.//' | cut -d. -f1)
          echo "Using envtest K8s minor $K8S_MINOR (from k8s.io/api in go.mod)"
          setup-envtest use "${K8S_MINOR}.x!" --bin-dir "$GITHUB_WORKSPACE/bin"
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use "${K8S_MINOR}.x!" --bin-dir "$GITHUB_WORKSPACE/bin" -p path)" >> $GITHUB_ENV
      - name: Run tests
        run: go test ./... -race -coverprofile=cover.out -covermode=atomic
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  build:
    name: build ${{ matrix.platform.name }}
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-latest
            docker: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            docker: linux/arm64
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform.docker }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/chaos-scheduler-operator,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform.name }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.platform.name }}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifest
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chaos-scheduler-operator
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in *; do echo "ghcr.io/${{ github.repository_owner }}/chaos-scheduler-operator@$(cat $f)"; done)
      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/chaos-scheduler-operator:${{ steps.meta.outputs.version }}