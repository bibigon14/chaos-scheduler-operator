# This rule is not used by the project chaos-scheduler-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to chaos.dstepanov.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: chaos-scheduler-operator
    app.kubernetes.io/managed-by: kustomize
  name: chaosexperiment-viewer-role
rules:
- apiGroups:
  - chaos.dstepanov.dev
  resources:
  - chaosexperiments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - chaos.dstepanov.dev
  resources:
  - chaosexperiments/status
  verbs:
  - get
