# Sample ChaosExperiment: kill one random pod in the `apps` namespace every
# two hours, protected by an availability SLO.
#
# The guardrail query returns 1 - avg availability across the victim pool
# over the last 5 minutes. `avg_over_time(up[5m])` per victim service falls
# below 1.0 when its scrape target is down, so `1 - avg` is the fraction of
# scrapes that missed. Aborting when that fraction exceeds 5% means we stop
# injecting chaos while any downstream service is already unhealthy - the
# canonical "don't kill more when things are already burning" pattern.
#
# The `job=~` regex targets exactly the scrape jobs backing our eligible
# workloads (bots + cache). demo-app lives in a separate namespace and has
# its own ChaosExperiment (see -demo sample).
#
# Prometheus is reachable at http://192.168.50.212:9090 from inside the k3s
# cluster (bare-metal Prometheus on the Pi host). Adjust for your setup.
apiVersion: chaos.dstepanov.dev/v1alpha1
kind: ChaosExperiment
metadata:
  labels:
    app.kubernetes.io/name: chaos-scheduler-operator
    app.kubernetes.io/managed-by: kustomize
  name: kill-random-app-pod
  namespace: apps
spec:
  schedule: "0 */2 * * *"
  selector:
    namespace: apps
    labelSelector:
      matchLabels:
        chaos.dstepanov.dev/eligible: "true"
  action:
    type: PodKill
    podKill:
      count: 1
  guardrail:
    prometheusUrl: http://192.168.50.212:9090
    query: '1 - avg(avg_over_time(up{job=~"wc2026bot|bridge|riverbot|redis"}[5m]))'
    abortIfGreaterThan: "0.05"
  ttl: 5m
