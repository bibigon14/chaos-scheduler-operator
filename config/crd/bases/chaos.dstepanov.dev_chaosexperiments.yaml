  name: chaosexperiments.chaos.dstepanov.dev
spec:
  group: chaos.dstepanov.dev
  names:
    kind: ChaosExperiment
    listKind: ChaosExperimentList
    plural: chaosexperiments
    shortNames:
    - chaos
    singular: chaosexperiment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.lastRun
      name: Last Run
      type: date
    - jsonPath: .status.lastResult
      name: Result
      type: string
    - jsonPath: .status.runs
      name: Runs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ChaosExperiment is a scheduled fault injection with an SLO guardrail.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChaosExperimentSpec defines the desired state of ChaosExperiment.
            properties:
              action:
                description: Action describes what to do when the experiment fires.
                properties:
                  podKill:
                    description: PodKill parameters, required when Type=PodKill.
                    properties:
                      count:
                        default: 1
                        description: Count of pods to kill per run.
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                  type:
                    description: ActionType enumerates supported chaos actions.
                    enum:
                    - PodKill
                    type: string
                required:
                - type
                type: object
              guardrail:
                description: |-
                  Guardrail aborts the run when a Prometheus signal crosses a threshold.
                  Absence means no guardrail is evaluated.
                properties:
                  abortIfGreaterThan:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      AbortIfGreaterThan is the exclusive upper bound. If the query value is
                      strictly greater, the run is aborted before the action executes.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  prometheusUrl:
                    description: |-
                      PrometheusURL points at a Prometheus HTTP API root (no trailing slash).
                      Example: http://prometheus.monitoring.svc:9090
                    type: string
                  query:
                    description: |-
                      Query is any PromQL that returns a scalar or an instant vector with
                      exactly one sample. Anything else fails the run with LastResult=Failed.
                    type: string
                required:
                - abortIfGreaterThan
                - prometheusUrl
                - query
                type: object
              schedule:
                description: |-
                  Schedule is a standard 5-field cron expression (min hour dom mon dow),
                  evaluated in the controller's local time zone.
                minLength: 9
                type: string
              selector:
                description: |-
                  Selector picks target pods for the action. Both fields are required to
                  prevent an empty selector matching every pod in the namespace.
                properties:
                  labelSelector:
                    description: |-
                      LabelSelector filters pods within Namespace. Required; the webhook
                      rejects a selector with no matchLabels and no matchExpressions.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespace:
                    description: |-
                      Namespace to target. Must not be empty; kube-system and other reserved
                      namespaces are rejected by the validating webhook.
                    minLength: 1
                    type: string
                required:
                - labelSelector
                - namespace
                type: object
              suspend:
                default: false
                description: Suspend halts scheduling without deleting the resource.
                type: boolean
              ttl:
                default: 5m
                description: TTL bounds the duration of a single experiment run.
                type: string
            required:
            - action
            - schedule
            - selector
            type: object
          status:
            description: ChaosExperimentStatus is the last-observed state of the resource.
            properties:
              conditions:
                description: Conditions holds standard status conditions for the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastResult:
                description: LastResult is the outcome of the last run.
                enum:
                - Completed
                - Aborted
                - Failed
                - Skipped
                type: string
              lastRun:
                description: LastRun is when the reconciler last attempted an action.
                format: date-time
                type: string
              nextRun:
                description: NextRun is the next scheduled fire time computed from
                  Spec.Schedule.
                format: date-time
                type: string
              reason:
                description: |-
                  Reason is human-readable context for LastResult, e.g. the guardrail
                  value that triggered an abort.
                type: string
              runs:
                description: |-
                  Runs is the cumulative count of Completed, Aborted, and Failed runs.
                  Skipped runs (Suspend=true, no due time) are not counted.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
