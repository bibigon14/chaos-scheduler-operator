# kustomizeconfig.yaml teaches kustomize which fields in the webhook
# configuration should get the prefix/namespace transformation applied.
# Without this, ValidatingWebhookConfiguration references wouldn't be
# rewritten to match the name-prefixed Service in the deployed namespace.
nameReference:
- kind: Service
  version: v1
  fieldSpecs:
  - kind: ValidatingWebhookConfiguration
    group: admissionregistration.k8s.io
    path: webhooks/clientConfig/service/name

namespace:
- kind: ValidatingWebhookConfiguration
  group: admissionregistration.k8s.io
  path: webhooks/clientConfig/service/namespace
  create: true

varReference:
- path: metadata/annotations
