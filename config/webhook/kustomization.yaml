# This kustomization bundles the webhook service with the manifest file
# generated by controller-gen from the +kubebuilder:webhook markers in
# internal/webhook/v1alpha1/chaosexperiment_webhook.go.
#
# Enable by uncommenting the `- ../webhook` line in ../default/kustomization.yaml.
resources:
- manifests.yaml
- service.yaml

configurations:
- kustomizeconfig.yaml
